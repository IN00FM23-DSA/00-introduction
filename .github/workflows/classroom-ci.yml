name: Classroom CI (provisional)

# This file is deliberately a thin, near-empty wrapper. All the actual
# logic (restore canonical files, run pytest, score) lives in
# reusable-ci.yml INSIDE THE CANONICAL TOPIC REPO, called via
# `uses:` below at a pinned ref -- a student editing THIS file (their
# own copy, in their own repo) can change what gets called, but cannot
# change what the call itself runs, since that always comes from the
# canonical repo they don't have push access to. See RISKS.md #13:
# this doesn't stop a student from deleting this file and writing their
# own from scratch, but it means the honest, default path exposes no
# scoring/restore logic to edit at all, and any tamper attempt is a
# full-file rewrite rather than a subtle one-line edit -- much easier
# to notice in a diff against the canonical template.

on:
  push:

jobs:
  pytest:
    uses: IN00FM23-DSA/00-introduction/.github/workflows/reusable-ci.yml@main
