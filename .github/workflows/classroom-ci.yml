name: Classroom CI (provisional)

# This is Tier-1 feedback only — fast and free, but not authoritative.
# A student with push access to this repo could edit this file to fake
# a result, so the recorded grade always comes from a teacher running
# 04-collect-grades.ps1 against the canonical template instead. See
# organization/RISKS.md #1 in the course-org-setup docs.
#
# Tests run inside a locked-down, disposable Docker container (no
# network, read-only filesystem, non-root, resource-capped) rather than
# directly on the runner's own filesystem -- see RISKS.md #10.

on:
  push:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 3   # overall safety net -- see RISKS.md #12
    steps:
      - uses: actions/checkout@v4

      - name: Restore canonical tests, helpers, points, scorer, and sandbox image
        run: |
          git clone --depth 1 https://github.com/IN00FM23-DSA/00-introduction.git __canonical
          rm -f test_*.py
          cp __canonical/test_*.py .
          cp __canonical/_helpers.py .
          cp __canonical/points.json .
          cp __canonical/score.py .
          cp __canonical/requirements.txt .
          cp __canonical/Dockerfile .
          rm -rf __canonical

      - name: Build sandbox image
        timeout-minutes: 2   # pulling the base image cold can take a while; not student-controlled, so not the security-critical timeout
        run: docker build -t classroom-grader .

      - name: Run tests (sandboxed — no network, read-only, non-root, resource-capped)
        timeout-minutes: 1   # this is the one that matters -- a hung/malicious exercise file gets killed here
        continue-on-error: true
        run: |
          mkdir -p /tmp/report
          docker run --rm \
            --network none \
            --memory 256m --cpus 1 --pids-limit 128 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --user 65532:65532 \
            --workdir /work \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD:/work:ro" \
            -v /tmp/report:/report:rw \
            classroom-grader \
            -q -p no:cacheprovider --junitxml=/report/report.xml
          cp /tmp/report/report.xml report.xml || true

      - name: Score
        run: python3 score.py
